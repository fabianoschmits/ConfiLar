<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Mensagem - ConfiLar</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            -webkit-font-smoothing: antialiased;
        }

        .wrapper {
            width: 100%;
            table-layout: fixed;
            background-color: #f1f5f9;
            padding-bottom: 40px;
        }

        .main {
            background-color: #f1f5f9;
            margin: 0 auto;
            width: 100%;
            max-width: 600px;
            border-spacing: 0;
            font-family: inherit;
            color: #1e293b;
        }

        .header {
            padding: 40px 0 20px 0;
            text-align: center;
        }

        .logo {
            width: 180px;
            height: auto;
        }

        .card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 48px 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 16px;
            text-align: center;
            letter-spacing: -0.02em;
        }

        .text {
            font-size: 16px;
            line-height: 24px;
            color: #475569;
            margin-bottom: 32px;
            text-align: center;
        }

        .message-box {
            background-color: #f8fafc;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 32px;
            border: 1px solid #e2e8f0;
            font-style: italic;
            color: #334155;
            text-align: center;
        }

        .button-wrapper {
            text-align: center;
            margin-bottom: 16px;
        }

        .button {
            background-color: #00b0b0;
            color: #ffffff !important;
            padding: 16px 32px;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            display: inline-block;
            box-shadow: 0 10px 15px -3px rgba(0, 176, 176, 0.3);
            transition: all 0.2s ease;
        }

        .footer {
            text-align: center;
            padding: 20px 32px;
        }

        .footer-text {
            font-size: 13px;
            color: #64748b;
            line-height: 20px;
            margin-bottom: 8px;
        }

        @media only screen and (max-width: 620px) {
            .card {
                padding: 32px 20px;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <center>
            <table class="main" width="100%">
                <tr>
                    <td class="header">
                        <img src="https://img.lightshot.app/jUaAq4CZS-myxiHUiOLMiA.png" alt="ConfiLar" class="logo">
                    </td>
                </tr>
                <tr>
                    <td>
                        <div class="card">
                            <h1 class="title">Você recebeu uma mensagem</h1>
                            <p class="text">
                                Olá! Alguém enviou uma nova mensagem para você no <span
                                    style="color: #00b0b0; font-weight: 600;">ConfiLar</span>. Não deixe seu contato
                                esperando!
                            </p>

                            <div class="message-box">
                                "Olá! Vi seu perfil e gostaria de saber mais sobre..."
                            </div>

                            <div class="button-wrapper">
                                <a href="https://app.confilar.com.br/chat" class="button">Responder Agora</a>
                            </div>

                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="footer">
                        <p class="footer-text"><strong>ConfiLar</strong> — Tecnologia a serviço da sua casa.</p>
                        <div class="footer-links" style="margin-top: 16px;">
                            <a href="#" style="color: #64748b; font-size: 12px; text-decoration: none;">Gerenciar
                                Notificações</a>
                        </div>
                    </td>
                </tr>
            </table>
        </center>
    </div>
</body>

</html>
